plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'


            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.debug', 'true'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            if (providers.gradleProperty('withoutBotania').isPresent())
                workingDirectory project.file('build/gametest-without-botania')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "ccapplied.refmap.json"
    config "ccapplied.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
    flatDir { dirs 'libs' }
    maven {
        name = "Progwml6's maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    // Botania remains optional for players; these dependencies enable integration tests.
    compileOnly fg.deobf("vazkii.botania:Botania:1.20.1-456-FORGE")
    // Development-only switch for verifying startup without the optional integration.
    if (!providers.gradleProperty('withoutBotania').isPresent()) {
        runtimeOnly fg.deobf("vazkii.botania:Botania:1.20.1-456-FORGE")
        runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-84-FORGE")
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    }
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI API (compile only) + runtime
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // AE2
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:6852919")
    implementation fg.deobf("curse.maven:guideme-1173950:7013686")

    //Mekanism (MC 1.20.1)
    implementation fg.deobf("curse.maven:mekanism-268560:6552911")

    // Draconic Evolution (MC 1.20.1)
    compileOnly fg.deobf("curse.maven:draconic-evolution-223565:6793843")
    runtimeOnly fg.deobf("curse.maven:draconic-evolution-223565:6793843")
    compileOnly fg.deobf("curse.maven:brandons-core-231382:5422013")
    runtimeOnly fg.deobf("curse.maven:brandons-core-231382:5422013")
    compileOnly fg.deobf("curse.maven:codechicken-lib-1-8-242818:5753868")
    runtimeOnly fg.deobf("curse.maven:codechicken-lib-1-8-242818:5753868")

    // Optional compile-time APIs. These are not bundled or required at runtime.
    compileOnly fg.deobf("curse.maven:extended-crafting-268387:6880322")
    compileOnly fg.deobf("curse.maven:cucumber-272335:6880321")

    // Dev test: Extended Crafting
     runtimeOnly fg.deobf("curse.maven:extended-crafting-268387:6880322")
     runtimeOnly fg.deobf("curse.maven:cucumber-272335:6880321")

    // Extended Crafting: Expanded
    // Uses the same mod id as Extended Crafting. Comment out regular Extended Crafting above before enabling.
    // runtimeOnly fg.deobf("curse.maven:extended-crafting-expanded-1017786:5613251")
    // runtimeOnly fg.deobf("curse.maven:cucumber-272335:6880321")

    // Re:Avaritia
    // runtimeOnly fg.deobf("curse.maven:re-avaritia-623969:7647188")

    // AvaritiaNeo
     runtimeOnly fg.deobf("curse.maven:avaritianeo-1083158:7940905")

    // Extended Terminal
    // runtimeOnly fg.deobf("curse.maven:myotus-lib-1496024:7995254")
    // runtimeOnly fg.deobf("curse.maven:extended-terminal-1302078:7995350")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'forge-1.20.1-1.20.6'

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),

        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
