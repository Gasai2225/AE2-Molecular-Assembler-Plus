plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

// Minecraft 1.21.1 requires Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

sourceSets.main.resources { srcDir('src/generated/resources') }

repositories {
    maven { url = 'https://maven.theillusivec4.top/' }
    mavenCentral()
    maven {
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        url = 'https://maven.blamejared.com'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Botania remains optional for players; these dependencies enable integration tests.
    compileOnly "vazkii.botania:botania-neoforge-1.21.1:457-20260922.100929-7"
    // Development-only switch for verifying startup without the optional integration.
    if (!providers.gradleProperty('withoutBotania').isPresent()) {
        localRuntime "vazkii.botania:botania-neoforge-1.21.1:457-20260922.100929-7"
        localRuntime "vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE"
        localRuntime "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    }
    implementation "net.neoforged:neoforge:${neo_version}"

    // JEI API (compile only) + local runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // AE2 is a hard dependency.
    implementation "curse.maven:applied-energistics-2-223794:7027323"
    localRuntime "curse.maven:guideme-1173950:6488254"

    // Optional integrations, kept available in dev runtime.
    compileOnly "curse.maven:extended-crafting-268387:7713533"
    localRuntime "curse.maven:extended-crafting-268387:7713533"

    compileOnly "curse.maven:cucumber-272335:7180790"
    localRuntime "curse.maven:cucumber-272335:7180790"

    compileOnly "curse.maven:draconic-evolution-223565:7584459"
    localRuntime "curse.maven:draconic-evolution-223565:7584459"

    compileOnly "curse.maven:brandons-core-231382:7130990"
    localRuntime "curse.maven:brandons-core-231382:7130990"

    compileOnly "curse.maven:codechicken-lib-1-8-242818:7281427"
    localRuntime "curse.maven:codechicken-lib-1-8-242818:7281427"

    compileOnly "curse.maven:avaritianeo-1083158:7940871"
    localRuntime "curse.maven:avaritianeo-1083158:7940871"
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        systemProperty 'mixin.debug', 'true'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        if (providers.gradleProperty('withoutBotania').isPresent())
            workingDirectory project.layout.buildDirectory.dir('gametest-without-botania')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // Keep data generation output in the workspace.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = "neoforge-${minecraft_version}"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
